# nginx config inside the Line Protection Simulator container.
# Plain HTTP on 8080 (unprivileged); the host's nginx terminates TLS, adds
# basic auth if wanted, and proxies here (see deploy/nginx-host.conf.example).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Security headers. add_header is only inherited by locations that set no
    # add_header of their own, so caching below uses `expires` instead.
    # The app is self-contained: no external scripts, styles, fonts or requests.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Vite's hashed assets never change
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Container health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Entry page (and SPA fallback) must always be revalidated
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
